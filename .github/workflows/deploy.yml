name: Deploy Python Handbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build website
        run: mkdocs build --strict

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
